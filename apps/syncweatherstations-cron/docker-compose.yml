services:
  weatherstations-db:
    image: postgres:18
    environment:
      POSTGRES_DB: weatherstations
      POSTGRES_USER: weatherstations_sync
      POSTGRES_PASSWORD: weatherstations_sync_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weatherstations_sync -d weatherstations"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "15432:5432"
    volumes:
      - weatherstations-db-data:/var/lib/postgresql

  dmi-proxy:
    image: nginx:1.27-alpine
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - ./dmi-proxy.nginx.conf:/etc/nginx/nginx.conf:ro

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.119.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    depends_on:
      - jaeger
    ports:
      - "4317:4317"
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro

  syncweatherstations-cron:
    build:
      context: ../..
      dockerfile: apps/syncweatherstations-cron/Dockerfile
    depends_on:
      dmi-proxy:
        condition: service_healthy
      weatherstations-db:
        condition: service_healthy
      otel-collector:
        condition: service_started
    environment:
      SPIN_VARIABLE_DB_URL: postgresql://weatherstations_sync:weatherstations_sync_dev@weatherstations-db:5432/weatherstations
      SPIN_VARIABLE_DB_OUTBOUND_HOST: postgres://weatherstations-db:5432
      SPIN_VARIABLE_DMI_PROXY_BASE_URL: http://dmi-proxy:8080
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: grpc
      OTEL_BSP_SCHEDULE_DELAY: "5000"
      OTEL_SERVICE_NAME: syncweatherstations-cron
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=pwerusage,deployment.environment=local-docker
      RUST_LOG: spin=debug,trigger_cron=debug
    restart: unless-stopped

volumes:
  weatherstations-db-data:
