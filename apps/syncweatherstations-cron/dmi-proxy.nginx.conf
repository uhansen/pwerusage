events {}

http {
    server {
        listen 8080;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        location /v2/metObs/collections/station/items {
            proxy_http_version 1.1;
            proxy_set_header Host opendataapi.dmi.dk;
            proxy_set_header Connection "";
            proxy_ssl_server_name on;
            proxy_pass https://opendataapi.dmi.dk;
        }

        location / {
            return 404;
        }
    }
}
