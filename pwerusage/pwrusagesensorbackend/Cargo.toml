[package]
name = "pwrusagesensorbackend"
authors = ["Uffe Hansen <uffe.hansen@gmail.com>"]
description = "MQTT sensor backend for normalized SaveEye edge readings"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[lib]
crate-type = [ "cdylib" ]

[dependencies]
anyhow = "1"
chrono = "0.4"
spin-mqtt-sdk = { git = "https://github.com/spinframework/spin-trigger-plugins", rev = "0a2260a4" }
spin-sdk = { version = "7.0.0", default-features = false, features = ["pg", "variables"] }
saveeye-telemetry = { path = "../saveeye-telemetry" }
serde_json = "1"

[workspace]