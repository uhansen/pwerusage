[package]
name = "save-eye-listener-app"
authors = ["Uffe Hansen <uffe.hansen@gmail.com>"]
description = "MQTT listener for SaveEye+ (Kamstrup) telemetry"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spin-mqtt-sdk = { git = "https://github.com/spinframework/spin-trigger-plugins" }
spin-sdk = { version = "7.0.0", default-features = false, features = ["key-value", "variables"] }

[workspace]
