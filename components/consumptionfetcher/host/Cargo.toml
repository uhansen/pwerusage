[package]
name = "consumptionfetcher-host"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
http = "1"
http-body-util = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-postgres = "0.7"
wasmtime = { version = "48", features = ["component-model", "async"] }
wasmtime-wasi = { version = "48", features = ["p3"] }
wasmtime-wasi-http = { version = "48", features = ["p3"] }

[dev-dependencies]
bytes = "1"
serde_json = "1"
