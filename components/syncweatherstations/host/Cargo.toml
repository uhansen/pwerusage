[package]
name = "syncweatherstations-host"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "charset", "http2"] }
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
serde_json = "1.0"
url = "2.5"
wasmtime = { version = "48.0", features = ["component-model", "async"] }
wasmtime-wasi = { version = "48.0", features = ["p3"] }
