[package]
name = "syncweatherstations"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
time = { version = "0.3", features = ["parsing"] }
url = "2.5"
wit-bindgen = { version = "0.62.0", features = ["macros"] }
